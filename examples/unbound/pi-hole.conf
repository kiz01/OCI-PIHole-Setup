server:
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    root-hints: "/var/lib/unbound/root.hints"

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    qname-minimisation: yes
    prefetch: yes
    prefetch-key: yes

    edns-buffer-size: 1232

    rrset-cache-size: 64m
    msg-cache-size: 32m
    num-threads: 1

    access-control: 127.0.0.1/32 allow
    access-control: 0.0.0.0/0 refuse
